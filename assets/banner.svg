<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Amber Glow Gradient for Retro Terminal Feel -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Cyan Line Accent -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Ambient Center Light -->
    <radialGradient id="centerGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: 16px;
      fill: url(#amberGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 3px;
      fill: #94A3B8;
    }
    .tagline-quote {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #06B6D4;
      letter-spacing: 1px;
    }
    .pill-text {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #E2E8F0;
      letter-spacing: 1px;
    }
  </style>

  <!-- Canvas Box -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Center Ambient Glow -->
  <circle cx="600" cy="120" r="450" fill="url(#centerGlow)" />

  <!-- Technical Grid Pattern Lines -->
  <g stroke="#1E293B" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.45">
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="850" y1="0" x2="850" y2="300" />
    <line x1="1050" y1="0" x2="1050" y2="300" />
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
  </g>

  <!-- Bottom Cyber Horizon Bar -->
  <path d="M 0,290 L 1200,290 L 1200,300 L 0,300 Z" fill="url(#lineGrad)" opacity="0.8" />

  <!-- Top Pill: Quote -->
  <g transform="translate(600, 48)">
    <rect x="-300" y="-14" width="600" height="28" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="-280" cy="0" r="3.5" fill="#F59E0B" />
    <text text-anchor="middle" y="4" class="tagline-quote">&quot;BACK IN MY DAY, WE DIDN'T INSTALL 500MB TO CENTER A DIV.&quot;</text>
  </g>

  <!-- Grand Title -->
  <text x="600" y="132" text-anchor="middle" class="brand-title">GRANDPA</text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" class="subtitle">BATTLE-TESTED, ZERO-BLOAT ARCHITECTURE ENGINE &amp; CLI SCANNER</text>

  <!-- Feature Pills -->
  <g transform="translate(600, 222)">
    <!-- Pill 1 -->
    <g transform="translate(-400, 0)">
      <rect x="0" y="-12" width="180" height="26" rx="13" fill="#1E293B" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="1" r="3" fill="#F59E0B" />
      <text x="100" y="5" text-anchor="middle" class="pill-text">ZERO-DEP CLI</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="-12" width="180" height="26" rx="13" fill="#1E293B" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="1" r="3" fill="#06B6D4" />
      <text x="100" y="5" text-anchor="middle" class="pill-text">BLOAT SCANNER</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(15, 0)">
      <rect x="0" y="-12" width="180" height="26" rx="13" fill="#1E293B" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="1" r="3" fill="#8B5CF6" />
      <text x="100" y="5" text-anchor="middle" class="pill-text">MULTI-AGENT SPEC</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="-12" width="180" height="26" rx="13" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="1" r="3" fill="#10B981" />
      <text x="100" y="5" text-anchor="middle" class="pill-text">PRE-COMMIT GUARD</text>
    </g>
  </g>
</svg>
