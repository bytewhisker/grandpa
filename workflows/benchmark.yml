name: Agentic Benchmark Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Run Benchmark Suite
        run: |
          python benchmarks/agentic/run.py
          node benchmarks/quick-compare.js
